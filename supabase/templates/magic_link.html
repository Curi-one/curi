<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Continue to Curi</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #fafafa;
      font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
      color: #0d0d0d;
    "
  >
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      style="max-width: 520px; margin: 0 auto"
    >
      <tr>
        <td
          style="
            background: #ffffff;
            border: 1px solid #e2e2e2;
            padding: 32px 28px;
          "
        >
          <p
            style="
              margin: 0 0 8px;
              font-family: 'JetBrains Mono', 'Courier New', monospace;
              font-size: 10px;
              letter-spacing: 0.18em;
              text-transform: uppercase;
              color: #a3a3a3;
            "
          >
            Curi
          </p>
          <h1
            style="
              margin: 0 0 12px;
              font-size: 28px;
              font-weight: 300;
              line-height: 1.1;
              letter-spacing: -0.03em;
            "
          >
            Continue to Curi
          </h1>
          <p
            style="
              margin: 0 0 24px;
              font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
              font-size: 15px;
              line-height: 1.6;
              color: #666666;
            "
          >
            Tap the button below on this device, or enter the six-digit code in
            the app. The link and code expire in one hour and work once.
          </p>

          <p style="margin: 0 0 28px; text-align: center">
            <a
              href="{{ .ConfirmationURL }}"
              style="
                display: inline-block;
                background: #0d0d0d;
                color: #ffffff;
                text-decoration: none;
                font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
                font-size: 14px;
                font-weight: 500;
                letter-spacing: 0.06em;
                padding: 14px 28px;
                box-shadow: inset 0 -3px 0 #c1121f;
              "
              >Open Curi</a
            >
          </p>

          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="margin: 0 0 24px"
          >
            <tr>
              <td style="border-top: 1px solid #e2e2e2; height: 1px"></td>
            </tr>
          </table>

          <p
            style="
              margin: 0 0 8px;
              font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
              font-size: 13px;
              color: #666666;
            "
          >
            Or enter this code in Curi:
          </p>
          <p
            style="
              margin: 0 0 24px;
              font-family: 'JetBrains Mono', 'Courier New', monospace;
              font-size: 32px;
              font-weight: 400;
              letter-spacing: 0.35em;
              color: #c1121f;
            "
          >
            {{ .Token }}
          </p>

          <p
            style="
              margin: 0;
              font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
              font-size: 12px;
              line-height: 1.5;
              color: #a3a3a3;
            "
          >
            Sent to {{ .Email }}. If you did not request this, you can ignore
            this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
